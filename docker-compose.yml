name: lumaatlas

services:
  lumaatlas:
    build:
      context: .
      dockerfile: Dockerfile
    image: lumaatlas:local
    container_name: lumaatlas
    restart: unless-stopped
    init: true
    ports:
      - '${LUMAATLAS_BIND:-127.0.0.1}:${LUMAATLAS_PORT:-3000}:3000'
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          'CMD',
          '/usr/bin/node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
